[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedoraxterm"
version = "1.0.0"
description = "A MobaXterm-like terminal and SSH client for Fedora Linux"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "FedoraXTerm Contributors"}
]
keywords = ["terminal", "ssh", "sftp", "network", "remote"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "PyGObject>=3.42.0",
    "paramiko>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/maciasangel1/tampermonkey"
Repository = "https://github.com/maciasangel1/tampermonkey"

[project.scripts]
fedoraxterm = "fedoraxterm.__main__:main"

[project.gui-scripts]
fedoraxterm-gui = "fedoraxterm.__main__:main"

[tool.setuptools.packages.find]
include = ["fedoraxterm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
